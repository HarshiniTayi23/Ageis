# Local development stack.
#   make up     start everything
#   make down   stop (data kept in named volumes)
#   make nuke   stop and delete all data
#
# Services:
#   minio       S3-compatible object storage with Object Lock: the vault backend.
#               Console: http://localhost:9001
#   minio-init  one-shot: creates the vault bucket WITH object lock and a
#               default COMPLIANCE retention, so nothing written can be deleted
#               early, not even by the MinIO admin.
#   postgres    sample "company database" that AI agents will act on in
#               Milestone 2 (agent action journal + rollback).
name: aegis

services:
  minio:
    # MinIO's own images are no longer pullable from Docker Hub or Quay (2026).
    # Chainguard rebuilds MinIO from source and keeps it patched. See ADR-0005.
    image: cgr.dev/chainguard/minio:latest
    user: "0:0" # write access to the named volume
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: ../../.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    # Uses the AWS CLI, the same S3 API Aegis will use against AWS itself.
    image: amazon/aws-cli:2.17.0
    depends_on: [minio]
    env_file: ../../.env
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3() { aws --endpoint-url http://minio:9000 s3api "$$@"; }
        for i in $$(seq 1 60); do s3 list-buckets >/dev/null 2>&1 && break; sleep 1; done
        # Object Lock can only be enabled when a bucket is CREATED.
        s3 head-bucket --bucket "$$AEGIS_BUCKET" 2>/dev/null ||
          s3 create-bucket --bucket "$$AEGIS_BUCKET" --object-lock-enabled-for-bucket
        s3 put-object-lock-configuration --bucket "$$AEGIS_BUCKET" --object-lock-configuration \
          "{\"ObjectLockEnabled\":\"Enabled\",\"Rule\":{\"DefaultRetention\":{\"Mode\":\"COMPLIANCE\",\"Days\":$$AEGIS_RETENTION_DAYS}}}"
        s3 get-object-lock-configuration --bucket "$$AEGIS_BUCKET"
        echo "vault bucket ready"
    restart: "no"

  postgres:
    image: postgres:16.4-alpine
    env_file: ../../.env
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minio-data:
  pg-data:
