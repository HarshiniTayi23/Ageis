name: Bug
description: Something does not work as specified
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      render: shell
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "S1: data loss or a restore that silently returns wrong data"
        - "S2: backup or restore fails loudly"
        - "S3: wrong output, workaround exists"
        - "S4: cosmetic"
    validations:
      required: true
